name: Publish NextBell Student APK

on:
  push:
    branches: ["feature/announcements"]
    paths:
      - "android/app/**"
      - "android/build.gradle"
      - "android/settings.gradle"
      - ".github/workflows/publish-student-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build student APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK into GitHub Pages files
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          DEST="docs/downloads/NextBell.apk"
          test -s "$APK"
          mkdir -p docs/downloads
          cp "$APK" "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "APK did not change; nothing to commit."
          else
            git commit -m "Publish latest NextBell student APK"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
