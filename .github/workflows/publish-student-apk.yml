name: Publish NextBell Student APK and Download Site

on:
  push:
    branches: ["feature/announcements"]
    paths:
      - "android/app/**"
      - "android/build.gradle"
      - "android/settings.gradle"
      - "docs/**"
      - ".github/workflows/publish-student-apk.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nextbell-download-site
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build student APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Add APK to download site
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p docs/downloads
          cp "$APK" docs/downloads/NextBell.apk

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website and APK
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
