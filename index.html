                <p><strong>To run NextBell:</strong></p>
                <ol style="padding-left:20px;">
                  <li>Open terminal in this project folder</li>
                  <li>Run <code>npm run dev</code></li>
                  <li>Open the local address shown (e.g. <code>http://localhost:5173</code>)</li>

              </div>

          }
        });
      }
    </script>
