plugins {
    id "com.android.application"
}

def stableStorePath = System.getenv("NEXTBELL_KEYSTORE_PATH")
def stableStorePassword = System.getenv("NEXTBELL_KEYSTORE_PASSWORD")
def stableKeyAlias = System.getenv("NEXTBELL_KEY_ALIAS")
def stableKeyPassword = System.getenv("NEXTBELL_KEY_PASSWORD")
def hasStableSigning = [stableStorePath, stableStorePassword, stableKeyAlias, stableKeyPassword]
        .every { it != null && !it.trim().isEmpty() }

if (hasStableSigning && !file(stableStorePath).isFile()) {
    throw new GradleException("The configured NextBell signing file is missing.")
}

android {
    namespace "com.nealaringale.nextbell"
    compileSdk 35

    defaultConfig {
        applicationId "com.nealaringale.nextbell"
        minSdk 26
        targetSdk 35
        def ciRun = System.getenv("GITHUB_RUN_NUMBER")
        versionCode = ciRun == null ? 5 : 1000 + ciRun.toInteger()
        versionName "0.5.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasStableSigning) {
            stable {
                storeFile file(stableStorePath)
                storePassword stableStorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasStableSigning) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            if (hasStableSigning) signingConfig signingConfigs.stable
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
