plugins {
    id "com.android.application"
}

// Firebase configuration is deliberately local to this app module. The build
// remains reproducible in CI without a private project's google-services.json.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

def stableStorePath = System.getenv("NEXTBELL_KEYSTORE_PATH")
def stableStorePassword = System.getenv("NEXTBELL_KEYSTORE_PASSWORD")
def stableKeyAlias = System.getenv("NEXTBELL_KEY_ALIAS")
def stableKeyPassword = System.getenv("NEXTBELL_KEY_PASSWORD")
def hasStableSigning = [stableStorePath, stableStorePassword, stableKeyAlias, stableKeyPassword]
        .every { it != null && !it.trim().isEmpty() }

if (hasStableSigning && !file(stableStorePath).isFile()) {
    throw new GradleException("The configured NextBell signing file is missing.")
}

// Never produce a Play release artifact without the persistent upload key.
// Debug builds remain available without signing secrets for local development.
def releaseArtifactRequested = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase()
    normalized.contains("bundlerelease") || normalized.contains("assemblerelease")
}
if (releaseArtifactRequested && !hasStableSigning) {
    throw new GradleException(
            "A signed NextBell release is required. Configure NEXTBELL_KEYSTORE_PATH, " +
            "NEXTBELL_KEYSTORE_PASSWORD, NEXTBELL_KEY_ALIAS and NEXTBELL_KEY_PASSWORD."
    )
}

android {
    namespace "com.nealaringale.nextbell"
    compileSdk 36

    defaultConfig {
        applicationId "com.nealaringale.nextbell"
        minSdk 26
        targetSdk 36

        def requestedVersionCode = System.getenv("NEXTBELL_VERSION_CODE")
        def ciRun = System.getenv("GITHUB_RUN_NUMBER")
        def fallbackVersionCode = ciRun == null ? 6 : 10000 + ciRun.toInteger()
        def resolvedVersionCode = requestedVersionCode != null && !requestedVersionCode.trim().isEmpty()
                ? requestedVersionCode.toInteger()
                : fallbackVersionCode
        if (resolvedVersionCode < 1) {
            throw new GradleException("NEXTBELL_VERSION_CODE must be a positive integer.")
        }
        versionCode resolvedVersionCode

        def requestedVersionName = System.getenv("NEXTBELL_VERSION_NAME")
        versionName = requestedVersionName == null || requestedVersionName.trim().isEmpty()
                ? "0.6.0"
                : requestedVersionName.trim()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasStableSigning) {
            stable {
                storeFile file(stableStorePath)
                storePassword stableStorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasStableSigning) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            if (hasStableSigning) signingConfig signingConfigs.stable
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:35.1.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"

    testImplementation "junit:junit:4.13.2"
}
